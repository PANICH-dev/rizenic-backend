services:
  rizenic-frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: rizenic-frontend
    # Port 3000 is occupied by the legacy Express UI in the local setup.
    # Override with FRONTEND_PORT=3000 when that service is stopped.
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    restart: unless-stopped
