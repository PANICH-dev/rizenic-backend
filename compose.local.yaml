name: rizenic-local

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rizenic_db
      POSTGRES_USER: rizenic
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run scripts/prepare-local-db.py first}
      TZ: UTC
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.local/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U rizenic -d rizenic_db -Atc \"SELECT EXISTS (SELECT 1 FROM rizenic_old.rizenicreport)\" | grep -qx t"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: infrastructure/local/Dockerfile
    environment:
      DATABASE_URL: postgresql://rizenic:${LOCAL_DB_PASSWORD}@postgres:5432/rizenic_db
      DATABASE_SSL: "false"
      DISABLE_LINE_NOTIFICATIONS: "true"
      PORT: "3000"
      TZ: UTC
    ports:
      - "127.0.0.1:${LOCAL_APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/statuses').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  postgres_data:
